<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#246018" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1410" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Zoeken — a clean, private metasearch engine that aggregates results without tracking your searches."
    />
    <meta name="application-name" content="Zoeken" />
    <meta name="robots" content="index, follow" />

    <title>Zoeken — private metasearch</title>

    <!-- Icons (root-absolute paths; served by zoeken-server / public/) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/zoeken-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Twitter: __ORIGIN__ rewritten to absolute by zoeken-server -->
    <link rel="canonical" href="__ORIGIN__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zoeken" />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:title" content="Zoeken — private metasearch" />
    <meta
      property="og:description"
      content="A clean, private metasearch engine that aggregates results without tracking your searches."
    />
    <meta property="og:image" content="__ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zoeken — private metasearch" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zoeken — private metasearch" />
    <meta
      name="twitter:description"
      content="A clean, private metasearch engine that aggregates results without tracking your searches."
    />
    <meta name="twitter:image" content="__ORIGIN__/og-image.png" />
    <meta name="twitter:image:alt" content="Zoeken — private metasearch" />

    <link
      rel="search"
      type="application/opensearchdescription+xml"
      title="Zoeken"
      href="/opensearch.xml"
    />

    <link
      rel="preload"
      href="/fonts/source-sans-3-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/source-sans-3-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Critical faces so text paints without waiting on the CSS chunk. -->
    <style>
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/source-sans-3-latin-400.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/source-sans-3-latin-700.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
