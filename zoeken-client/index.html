<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#246018" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1410" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Zoeken — a clean, private metasearch engine that aggregates results without tracking your searches."
    />
    <meta name="application-name" content="Zoeken" />
    <meta name="robots" content="index, follow" />

    <title>Zoeken — private metasearch</title>

    <!-- Icons (root-absolute paths; served by zoeken-server / public/) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/zoeken-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Twitter: __ORIGIN__ rewritten to absolute by zoeken-server -->
    <link rel="canonical" href="__ORIGIN__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zoeken" />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:title" content="Zoeken — private metasearch" />
    <meta
      property="og:description"
      content="A clean, private metasearch engine that aggregates results without tracking your searches."
    />
    <meta property="og:image" content="__ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zoeken — private metasearch" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zoeken — private metasearch" />
    <meta
      name="twitter:description"
      content="A clean, private metasearch engine that aggregates results without tracking your searches."
    />
    <meta name="twitter:image" content="__ORIGIN__/og-image.png" />
    <meta name="twitter:image:alt" content="Zoeken — private metasearch" />

    <link
      rel="search"
      type="application/opensearchdescription+xml"
      title="Zoeken"
      href="/opensearch.xml"
    />

    <link
      rel="preload"
      href="/fonts/source-sans-3-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/source-sans-3-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/zoeken-logo.svg" as="image" type="image/svg+xml" />
    <!-- Critical faces + boot shell so LCP paints before the JS chunk. -->
    <style>
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/source-sans-3-latin-400.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/source-sans-3-latin-700.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        color-scheme: light dark;
        --surface: #f2f5ee;
        --surface-raised: #ffffff;
        --ink: #0b140e;
        --ink-subtle: #445548;
        --line: #b4c4b2;
        --accent: #246018;
        --atmosphere: radial-gradient(
            ellipse 90% 60% at 50% -10%,
            rgba(36, 96, 24, 0.12),
            transparent 55%
          ),
          linear-gradient(180deg, #f2f5ee 0%, #e6ede1 100%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #0f1410;
          --surface-raised: #171d18;
          --ink: #e8efe6;
          --ink-subtle: #7a8a7c;
          --line: #2a342c;
          --accent: #7cbc4a;
          --atmosphere: radial-gradient(
              ellipse 90% 60% at 50% -10%,
              rgba(124, 188, 74, 0.14),
              transparent 55%
            ),
            linear-gradient(180deg, #0f1410 0%, #121812 100%);
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--atmosphere);
        background-color: var(--surface);
        color: var(--ink);
        font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      }
      #boot-shell {
        min-height: 100dvh;
      }
      #boot-shell[hidden] {
        display: none !important;
      }
      .boot-home {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem 16vh;
        box-sizing: border-box;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2.5rem;
      }
      .boot-brand img {
        width: 3.5rem;
        height: 3.5rem;
      }
      .boot-brand h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 3.75rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1;
      }
      .boot-bar {
        width: min(100%, 40rem);
        height: 3.5rem;
        border-radius: 1rem;
        border: 1px solid var(--line);
        background: var(--surface-raised);
        box-shadow:
          0 1px 3px rgba(20, 32, 24, 0.06),
          0 8px 24px rgba(20, 32, 24, 0.06);
      }
      .boot-serp {
        min-height: 100dvh;
        background: var(--surface);
      }
      .boot-serp-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--line);
      }
      .boot-serp-header img {
        width: 2rem;
        height: 2rem;
        flex-shrink: 0;
      }
      .boot-serp-bar {
        flex: 1;
        max-width: 40rem;
        height: 2.75rem;
        border-radius: 0.75rem;
        border: 1px solid var(--line);
        background: var(--surface-raised);
      }
      .boot-serp-body {
        max-width: 40rem;
        padding: 1.5rem 1rem;
        color: var(--ink-subtle);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <!-- Static first paint inside #app; React createRoot replaces it on mount. -->
    <div id="app">
      <div id="boot-shell" aria-hidden="true">
        <div class="boot-home" id="boot-home">
          <div class="boot-brand">
            <img src="/zoeken-logo.svg" alt="" width="56" height="56" />
            <h1>Zoeken</h1>
          </div>
          <div class="boot-bar"></div>
        </div>
        <div class="boot-serp" id="boot-serp" hidden>
          <div class="boot-serp-header">
            <img src="/zoeken-logo.svg" alt="" width="32" height="32" />
            <div class="boot-serp-bar"></div>
          </div>
          <div class="boot-serp-body">Loading results…</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var path = location.pathname;
        if (path === "/search" || path.indexOf("/search/") === 0) {
          var home = document.getElementById("boot-home");
          var serp = document.getElementById("boot-serp");
          if (home) home.hidden = true;
          if (serp) serp.hidden = false;
          document.title = "Search — Zoeken";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
