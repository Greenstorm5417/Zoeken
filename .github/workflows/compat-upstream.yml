name: Upstream compatibility refresh

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Refresh compatibility inventory from upstream
        run: uv run --no-project --python 3.13 tools/compat_inventory.py --fetch-upstream

      - name: Open PR if inventory changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/compatibility; then
            echo "Compatibility inventory already up to date."
            exit 0
          fi
          branch="chore/compat-inventory-$(date -u +%Y%m%d)"
          git config user.name "Greenstorm5417"
          git config user.email "130579625+Greenstorm5417@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- docs/compatibility
          git commit --author="Greenstorm5417 <130579625+Greenstorm5417@users.noreply.github.com>" \
            -m "chore: refresh SearXNG compatibility inventory"
          git push -u origin HEAD
          gh pr create \
            --title "chore: refresh SearXNG compatibility inventory" \
            --body "Automated weekly refresh of \`docs/compatibility\` from upstream SearXNG." \
            --base main \
            --head "$branch"
