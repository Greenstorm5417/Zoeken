name: Upstream compatibility refresh

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Refresh compatibility inventory from upstream
        run: uv run --no-project --python 3.13 tools/compat_inventory.py --fetch-upstream

      - name: Commit refreshed inventory if needed
        run: |
          set -euo pipefail
          git config user.name "Greenstorm5417"
          git config user.email "130579625+Greenstorm5417@users.noreply.github.com"
          git add -- docs/compatibility
          if git diff --staged --quiet; then
            echo "Compatibility inventory already up to date."
            exit 0
          fi
          git commit --author="Greenstorm5417 <130579625+Greenstorm5417@users.noreply.github.com>" \
            -m "chore: refresh SearXNG compatibility inventory"
          git push
