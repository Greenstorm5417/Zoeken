name: Tracker patterns refresh

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Fetch ClearURLs tracker patterns
        run: uv run --no-project --python 3.13 tools/fetch_tracker_patterns.py

      - name: Open PR if patterns changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- zoeken/zoeken-data/data/tracker_patterns.json; then
            echo "Tracker patterns already up to date."
            exit 0
          fi
          branch="chore/tracker-patterns-$(date -u +%Y%m%d)"
          git config user.name "Greenstorm5417"
          git config user.email "130579625+Greenstorm5417@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- zoeken/zoeken-data/data/tracker_patterns.json
          git commit --author="Greenstorm5417 <130579625+Greenstorm5417@users.noreply.github.com>" \
            -m "chore: refresh ClearURLs tracker patterns"
          git push -u origin HEAD
          gh pr create \
            --title "chore: refresh ClearURLs tracker patterns" \
            --body "Automated refresh via \`tools/fetch_tracker_patterns.py\`." \
            --base main \
            --head "$branch"
