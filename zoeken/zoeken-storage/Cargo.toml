[package]
name = "zoeken-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[features]
default = ["postgres"]
# Optional: multi-replica coordination. Omit for smaller sqlite-only binaries
# (low-power / single-node): cargo build -p zoeken-server --no-default-features
postgres = ["sqlx/postgres"]

[dependencies]
async-trait = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "postgres_coordination"
required-features = ["postgres"]

[[test]]
name = "storage_contract"
# Includes an optional postgres case gated inside the test file.

[lints]
workspace = true
